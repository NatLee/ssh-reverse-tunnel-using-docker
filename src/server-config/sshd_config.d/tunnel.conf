# sshd settings for the outside server (docker-compose.server.yml).
#
# The linuxserver/openssh-server image includes every *.conf file mounted at
# /config/sshd/sshd_config.d before its own sshd_config, and sshd keeps the first
# value it reads, so these lines win over the image defaults. The folder is
# mounted read-only, so the image cannot move or rewrite it.
#
# Check what sshd really uses:
#   docker compose -f docker-compose.server.yml exec reverse-server sh -c '/usr/sbin/sshd.pam -T -f /config/sshd/sshd_config -h /config/ssh_host_keys/ssh_host_ed25519_key'

# Keys only. Password login stays off (PASSWORD_ACCESS=false in the compose file).
PermitRootLogin no
KbdInteractiveAuthentication no

# This server only carries reverse tunnels. ./tunnel.sh authorize limits each
# key to its own tunnel port (see tunnel_key_options in tunnel.sh); these
# lines hold for every key, also one added by hand:
# - no shell and no command, whatever the client asks for;
# - only ssh -R: nobody can use this server to reach other hosts (ssh -L / -W);
# - no agent, X11 or terminal.
ForceCommand echo 'This server only opens reverse tunnels. There is no shell here.' >&2; exit 1
AllowTcpForwarding remote
AllowAgentForwarding no
X11Forwarding no
PermitTTY no

# The inside machine asks for "*:<tunnel port>" (ssh -R), so the tunnel port
# listens on every interface of this container and Docker can publish it.
# clientspecified only binds where the client asks; "yes" would force it for
# every forward.
GatewayPorts clientspecified

# Drop a dead tunnel after about 45 seconds, so the port is free again when
# the inside machine reconnects.
ClientAliveInterval 15
ClientAliveCountMax 3
