# sshd settings for the inside container (docker-compose.yml).
#
# The linuxserver/openssh-server image includes every *.conf file mounted at
# /config/sshd/sshd_config.d before its own sshd_config, and sshd keeps the first
# value it reads, so these lines win over the image defaults. The folder is
# mounted read-only, so the image cannot move or rewrite it.
#
# Check what sshd really uses:
#   docker compose exec reverse-client sh -c '/usr/sbin/sshd.pam -T -f /config/sshd/sshd_config -h /config/ssh_host_keys/ssh_host_ed25519_key'

# Keys only. Password login stays off (PASSWORD_ACCESS=false in the compose file).
PermitRootLogin no
KbdInteractiveAuthentication no

# Lets you hop from here to other machines on the inside network (ssh -J).
AllowTcpForwarding yes
AllowAgentForwarding yes
GatewayPorts no
X11Forwarding yes
